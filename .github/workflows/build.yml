name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK (installable)
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          find android/app/build/outputs -name '*.apk' -type f -exec cp {} dist/ \;
          ls -la dist

      # Tag push (v*) -> versioned Release
      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

      # Push to main -> rolling "latest" Release (upsert)
      - name: Release (latest, main push)
        if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          files: dist/*.apk
          body: |
            自动构建于 main 分支最新提交 (${{ github.sha }})。
            Debug 签名 APK，可直接安装。

      # Manual run -> upload as workflow artifact
      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: phoswitch-debug-apk
          path: dist/*.apk
